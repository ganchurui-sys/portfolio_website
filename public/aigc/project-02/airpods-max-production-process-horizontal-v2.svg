<svg xmlns="http://www.w3.org/2000/svg" width="3360" height="960" viewBox="0 0 3360 960" role="img" aria-labelledby="title desc">
<title id="title">AirPods Max AIGC 横向制作流程</title>
<desc id="desc">01 创意定位：围绕降噪与沉浸式聆听，确立科技、时尚与超现实的视觉方向。产出：创意简述与视觉方向。 02 叙事开发：城市喧嚣 → 佩戴耳机 → 开启降噪泡泡悬停 → 车流悬浮 → 城市花开最终回到产品与品牌收束。产出：故事结构与情绪节奏。 03 视觉设定：同步建立产品、人物与场景的视觉参考。产出：贯穿关键帧与动态镜头的一致性基准。 04 分镜与关键帧：规划景别、构图与人物动作，明确运镜和声音节点，为每个镜头建立视觉参考。产出：故事板与镜头关键帧。 05 动态生成：以参考图约束人物、产品与场景，设计动作、运镜和超现实事件，逐镜筛选可用的生成结果。产出：可进入剪辑的动态镜头。 06 后期制作：剪辑节奏、镜头衔接与统一调色，分层处理音乐、脚步与车流声，建立城市声渐弱、音乐渐强的转折。产出：画面与声音共同完成的情绪叙事。 07 成片输出：输出 4K 完整影片与 Hero 片段，整理主视觉及制作过程，优化网页播放体积与加载体验。产出：完整影片 / Hero 片段 / 项目主视觉。人物比例、产品外形或动作连续性出现偏差时，返回关键帧修正后重新生成。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#66636b"/></marker></defs>
